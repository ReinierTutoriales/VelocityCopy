name: Release

# Publishes an unsigned release from the exact installers that Windows Package
# built on a commit of main (nothing is rebuilt). Run it from the Actions tab
# with the version number; the commit defaults to the current tip of main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.2.3 (must match Version.h on that commit)'
        required: true
      sha:
        description: 'Commit of main to publish (empty: current tip of main)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

concurrency:
  group: release-velocitycopy
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Verify the build and publish its exact installers
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess, zipfile

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          repo = os.environ["GH_REPO"]
          version = os.environ["VERSION"].strip().lstrip("v")
          sha = os.environ["SHA"].strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Version must look like 1.2.3"
          assert re.fullmatch(r"[0-9a-f]{40}", sha), "Commit must be a full 40-character SHA"
          tag = f"v{version}"

          # The commit must be on main and carry this exact version.
          compare = api(f"repos/{repo}/compare/{sha}...main")
          assert compare["status"] in ("identical", "ahead"), "Commit is not on main"
          header = base64.b64decode(api(f"repos/{repo}/contents/src/ui/VelocityCopy.UI/Version.h?ref={sha}")["content"]).decode()
          assert f'#define VELOCITYCOPY_VERSION_STRING "{version}.0"' in header, "Version.h on that commit does not match"
          existing = subprocess.run(["gh", "api", f"repos/{repo}/git/ref/tags/{tag}"], capture_output=True)
          assert existing.returncode != 0, f"Tag {tag} already exists"

          runs = api(f"repos/{repo}/actions/workflows/package.yml/runs?head_sha={sha}&event=push&status=success&per_page=10")["workflow_runs"]
          runs = [r for r in runs if r["head_sha"] == sha and r["conclusion"] == "success" and r["head_branch"] == "main"]
          assert runs, "No successful Windows Package run on main for this commit"
          run_id = runs[0]["id"]

          artifacts = api(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
          output = pathlib.Path("release-assets")
          output.mkdir()
          files, hashes = [], []
          for arch, filename in (("x64", "VelocityCopy-Setup-x64.exe"), ("arm64", "VelocityCopy-Setup-ARM64.exe")):
              name = f"VelocityCopy-Setup-{arch}-{version}.0"
              matches = [a for a in artifacts if a["name"] == name]
              assert len(matches) == 1 and not matches[0]["expired"], f"Missing artifact {name}"
              archive = output / f"{name}.zip"
              with archive.open("wb") as stream:
                  subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{matches[0]['id']}/zip"], stdout=stream, check=True)
              with zipfile.ZipFile(archive) as z:
                  entries = [i for i in z.infolist() if not i.is_dir()]
                  assert len(entries) == 1 and pathlib.PurePosixPath(entries[0].filename).name == filename, "Unexpected artifact contents"
                  binary = z.read(entries[0])
              assert binary[:2] == b"MZ", "Invalid Windows installer"
              destination = output / filename.replace(".exe", f"-{tag}.exe")
              destination.write_bytes(binary)
              files.append(str(destination))
              hashes.append(f"{hashlib.sha256(binary).hexdigest()}  {destination.name}")
          checksum = output / "SHA256SUMS.txt"
          checksum.write_text("\n".join(hashes) + "\n")
          files.append(str(checksum))

          # Release notes: this version's CHANGELOG section on that commit.
          changelog = base64.b64decode(api(f"repos/{repo}/contents/CHANGELOG.md?ref={sha}")["content"]).decode()
          section = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", changelog, re.S | re.M)
          assert section, f"CHANGELOG.md has no section for {version}"
          notes = output / "release-notes.md"
          notes.write_text(
              f"VelocityCopy {version}\n\n{section.group(1).strip()}\n\n"
              "Downloads:\n"
              "- x64 installer for Intel/AMD Windows 11 PCs.\n"
              "- ARM64 installer for Windows on ARM PCs.\n\n"
              "These installers are published without an Authenticode digital signature, as explicitly authorized by the repository owner. "
              "Windows may display an unknown-publisher or SmartScreen prompt. Verify downloads against SHA256SUMS.txt.\n\n"
              f"Source: {sha} ({tag}).\n"
              f"Windows Package passed on this exact commit (run {run_id}); assets are that run's artifacts, not rebuilt or modified.\n")
          subprocess.run(["gh", "release", "create", tag, *files, "--target", sha, "--title", f"VelocityCopy {tag}", "--notes-file", str(notes), "--latest"], check=True)
          release = api(f"repos/{repo}/releases/tags/{tag}")
          names = {a["name"] for a in release["assets"]}
          assert all(pathlib.Path(f).name in names for f in files), "Release asset verification failed"
          assert api(f"repos/{repo}/git/ref/tags/{tag}")["object"]["sha"] == sha, "Release tag points at the wrong commit"
          print(release["html_url"])
