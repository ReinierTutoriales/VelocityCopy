name: Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package.yml"
      - "CMakeLists.txt"
      - "src/core/**"
      - "src/shell/**"
      - "src/ui/**"
      - "tools/VelocityCopy-Test-Installer.nsi"
    tags:
      - "v*"

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $version = "0.21.$env:GITHUB_RUN_NUMBER.0"
          "VELOCITYCOPY_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build core
        shell: pwsh
        run: |
          cmake -S . -B build/x64 -A x64 -DVELOCITYCOPY_HYBRID_CRT=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build/x64 --config Release --target velocitycopy_core VelocityCopyShell --parallel
          if ($LASTEXITCODE -ne 0) { throw "Core build failed" }

      - name: Build self-contained WinUI x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }
          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxPackage=false /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:EnableMsixTooling=true /p:SkipVelocityCopyCoreBuild=true
          if ($LASTEXITCODE -ne 0) { throw "Self-contained WinUI build failed" }

      - name: Stage autonomous x64 payload
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter VelocityCopy.WinUI.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/].*[\\/]Release[\\/]' -or $_.FullName -match '[\\/]Release[\\/].*[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter VelocityCopy.WinUI.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "VelocityCopy.WinUI.exe was not produced" }
          $source = $exe.Directory.FullName
          $payload = "artifacts/installer-payload-x64"
          Remove-Item $payload -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $payload | Out-Null
          Get-ChildItem $source -File | Where-Object { $_.Extension -notin '.pdb','.ilk','.lib','.exp','.iobj','.ipdb' } | Copy-Item -Destination $payload
          Get-ChildItem $source -Directory | ForEach-Object { Copy-Item $_.FullName -Destination $payload -Recurse }
          if (-not (Test-Path "$payload/VelocityCopy.WinUI.exe")) { throw "Installer payload is missing executable" }
          $forbidden = @(Get-ChildItem $payload -Recurse -File | Where-Object { $_.Extension -in '.msix','.msixbundle','.appx','.appxbundle','.cer','.pfx' })
          if ($forbidden.Count) { throw "Installer payload contains package/certificate artifacts" }
          $size = (Get-ChildItem $payload -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Self-contained x64 payload: {0:N1} MB" -f ($size / 1MB))

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }

      - name: Build classic x64 installer
        shell: pwsh
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "NSIS is unavailable on the runner" }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $payload = (Resolve-Path artifacts/installer-payload-x64).Path
          $output = Join-Path (Resolve-Path artifacts/installer).Path "VelocityCopy-Setup-x64.exe"
          & $makensis "/DPAYLOAD_DIR=$payload" "/DOUTPUT_FILE=$output" "/DDISPLAY_VERSION=$env:VELOCITYCOPY_VERSION" tools/VelocityCopy-Test-Installer.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw "Classic installer build failed" }

      - name: Smoke install classic x64 installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path artifacts/installer/VelocityCopy-Setup-x64.exe).Path
          $install = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $root = Join-Path $env:ProgramFiles "VelocityCopy"
          $exe = Join-Path $root "VelocityCopy.WinUI.exe"
          $uninstaller = Join-Path $root "Uninstall.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable is missing" }
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing" }
          Write-Host "Installed payload validated at $root"

      - name: Smoke uninstall classic x64 installer
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles "VelocityCopy"
          $uninstaller = Join-Path $root "Uninstall.exe"
          $p = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $root) { throw "Installation directory remains after uninstall" }

      - name: Upload validated x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: VelocityCopy-Setup-x64-${{ env.VELOCITYCOPY_VERSION }}
          path: artifacts/installer/VelocityCopy-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
