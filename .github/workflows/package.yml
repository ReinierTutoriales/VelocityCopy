name: Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package.yml"
      - "CMakeLists.txt"
      - "src/core/**"
      - "src/shell/**"
      - "src/ui/**"
      - "tools/Install-VelocityCopy-Test.ps1"
      - "tools/VelocityCopy-Test-Installer.nsi"
      - "tests/system_integration_architecture_test.cpp"
      - "tests/queue_persistence_architecture_test.cpp"
    tags:
      - "v*"

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build/x64 -A x64

      - name: Build core
        run: cmake --build build/x64 --config Release --parallel

      - name: Test core
        run: ctest --test-dir build/x64 -C Release --output-on-failure

      - name: Stamp test package version
        shell: pwsh
        run: |
          $manifest = "src/ui/VelocityCopy.UI/Package.appxmanifest"
          $version = "0.20.$env:GITHUB_RUN_NUMBER.0"
          $content = Get-Content -LiteralPath $manifest -Raw
          $content = [regex]::Replace(
            $content,
            '(<Identity\s+Name="ReinierTutoriales\.VelocityCopy"\s+Publisher="CN=ReinierTutoriales"\s+Version=")[^"]+(")',
            ('${1}' + $version + '${2}')
          )
          Set-Content -LiteralPath $manifest -Value $content -Encoding utf8

          $stamped = Get-Content -LiteralPath $manifest -Raw
          if ($stamped -notmatch ('Version="' + [regex]::Escape($version) + '"')) {
            throw "Failed to stamp VelocityCopy package version $version"
          }
          "VELOCITYCOPY_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VelocityCopy test package version: $version"

      - name: Build WinUI 3 x64 Release and MSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          $packageDir = Join-Path (Resolve-Path ".").Path "artifacts\AppPackages\"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir"
          if ($LASTEXITCODE -ne 0) { throw "WinUI/MSIX build failed with exit code $LASTEXITCODE" }

      - name: Build WinUI 3 ARM64 Release and MSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          $packageDir = Join-Path (Resolve-Path ".").Path "artifacts\AppPackages-ARM64\"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir"
          if ($LASTEXITCODE -ne 0) { throw "WinUI/ARM64 MSIX build failed with exit code $LASTEXITCODE" }

          $armPackages = @(
            Get-ChildItem -LiteralPath $packageDir -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          if ($armPackages.Count -ne 1) {
            throw "Expected exactly one ARM64 VelocityCopy MSIX package, found $($armPackages.Count)"
          }

      - name: Audit generated MSIX manifests
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*" -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "x64\makeappx.exe") } |
            Select-Object -First 1
          if (-not $sdkBin) { throw "Windows SDK MakeAppx.exe was not found" }
          $makeappx = Join-Path $sdkBin.FullName "x64\makeappx.exe"

          foreach ($architecture in @("x64", "arm64")) {
            $sourceRoot = if ($architecture -eq "x64") { "artifacts/AppPackages" } else { "artifacts/AppPackages-ARM64" }
            $packages = @(Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter *.msix | Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" })
            if ($packages.Count -ne 1) { throw "Expected exactly one $architecture application MSIX, found $($packages.Count)" }
            $unpack = Join-Path $env:RUNNER_TEMP ("VelocityCopy-ManifestAudit-" + $architecture)
            Remove-Item -LiteralPath $unpack -Recurse -Force -ErrorAction SilentlyContinue
            & $makeappx unpack /p $packages[0].FullName /d $unpack /o
            if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed to unpack $architecture MSIX" }
            [xml]$manifest = Get-Content -LiteralPath (Join-Path $unpack "AppxManifest.xml") -Raw
            $identity = $manifest.Package.Identity.Name
            $dependencyNames = @($manifest.Package.Dependencies.PackageDependency | ForEach-Object { $_.Name })
            Write-Host "$architecture Identity: $identity"
            Write-Host "$architecture declared dependencies: $($dependencyNames -join ', ')"
            if ($identity -ne "ReinierTutoriales.VelocityCopy") { throw "Unexpected $architecture package Identity Name: $identity" }
            if ($dependencyNames | Where-Object { $_ -like "Microsoft.UI.Xaml*" }) { throw "$architecture generated manifest declares forbidden Microsoft.UI.Xaml dependency" }
            if (-not ($dependencyNames | Where-Object { $_ -like "Microsoft.VCLibs*" })) { throw "$architecture generated manifest does not declare Microsoft.VCLibs" }
            if (-not ($dependencyNames | Where-Object { $_ -like "Microsoft.WindowsAppRuntime*" })) { throw "$architecture generated manifest does not declare Microsoft.WindowsAppRuntime" }
          }

      - name: Bundle and sign Windows test package
        shell: pwsh
        timeout-minutes: 5
        run: |
          $x64Packages = @(
            Get-ChildItem -Path artifacts/AppPackages -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          $arm64Packages = @(
            Get-ChildItem -Path artifacts/AppPackages-ARM64 -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          if ($x64Packages.Count -ne 1 -or $arm64Packages.Count -ne 1) {
            throw "Expected exactly one x64 and one ARM64 VelocityCopy MSIX package."
          }

          $bundleInput = Join-Path (Resolve-Path ".").Path "artifacts\BundleInput"
          New-Item -ItemType Directory -Force -Path $bundleInput | Out-Null
          Copy-Item -LiteralPath $x64Packages[0].FullName -Destination (Join-Path $bundleInput "VelocityCopy-x64.msix") -Force
          Copy-Item -LiteralPath $arm64Packages[0].FullName -Destination (Join-Path $bundleInput "VelocityCopy-arm64.msix") -Force

          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*" -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "x64\makeappx.exe") } |
            Select-Object -First 1
          if (-not $sdkBin) { throw "Windows SDK MakeAppx.exe was not found" }
          $makeappx = Join-Path $sdkBin.FullName "x64\makeappx.exe"
          $signtool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          if (-not (Test-Path -LiteralPath $signtool -PathType Leaf)) { throw "SignTool.exe was not found" }

          $bundleDir = Join-Path (Resolve-Path ".").Path "artifacts\Bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $bundle = Join-Path $bundleDir "VelocityCopy.msixbundle"
          & $makeappx bundle /d $bundleInput /p $bundle /o
          if ($LASTEXITCODE -ne 0) { throw "MSIX bundle creation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "VelocityCopy.msixbundle was not produced" }

          $plainPassword = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $plainPassword -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=ReinierTutoriales" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            ) `
            -FriendlyName "VelocityCopy CI Test Signing"

          $pfx = Join-Path $env:RUNNER_TEMP "VelocityCopy-Test.pfx"
          $cer = Join-Path $bundleDir "VelocityCopy-Test.cer"
          try {
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null

            & $signtool sign /fd SHA256 /a /f $pfx /p $plainPassword $bundle
            if ($LASTEXITCODE -ne 0) { throw "Bundle signing failed with exit code $LASTEXITCODE" }

            $signature = Get-AuthenticodeSignature -FilePath $bundle
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Unexpected signer certificate for VelocityCopy.msixbundle"
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
          }

      - name: Stage and audit universal installer payload
        shell: pwsh
        run: |
          $payload = "artifacts/VelocityCopy-InstallerPayload"
          Remove-Item -LiteralPath $payload -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          $bundleRoot = (Resolve-Path "artifacts/Bundle").Path
          foreach ($file in @("VelocityCopy.msixbundle", "VelocityCopy-Test.cer")) {
            $source = Join-Path $bundleRoot $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "$file was not found" }
            Copy-Item -LiteralPath $source -Destination $payload -Force
          }

          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*" -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "x64\makeappx.exe") } |
            Select-Object -First 1
          if (-not $sdkBin) { throw "Windows SDK MakeAppx.exe was not found" }
          $makeappx = Join-Path $sdkBin.FullName "x64\makeappx.exe"

          foreach ($architecture in @("x64", "arm64")) {
            $sourceRoot = if ($architecture -eq "x64") { "artifacts/AppPackages" } else { "artifacts/AppPackages-ARM64" }
            $appPackages = @(Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter *.msix | Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" })
            if ($appPackages.Count -ne 1) { throw "Expected exactly one $architecture application MSIX" }
            $appUnpack = Join-Path $env:RUNNER_TEMP ("VelocityCopy-DependencyGraph-" + $architecture)
            Remove-Item -LiteralPath $appUnpack -Recurse -Force -ErrorAction SilentlyContinue
            & $makeappx unpack /p $appPackages[0].FullName /d $appUnpack /o
            if ($LASTEXITCODE -ne 0) { throw "Could not unpack $architecture application MSIX" }
            [xml]$appManifest = Get-Content -LiteralPath (Join-Path $appUnpack "AppxManifest.xml") -Raw
            $requiredNames = @($appManifest.Package.Dependencies.PackageDependency | ForEach-Object { [string]$_.Name } | Where-Object { $_ } | Sort-Object -Unique)
            if ($requiredNames | Where-Object { $_ -like "Microsoft.UI.Xaml*" }) { throw "$architecture manifest unexpectedly requires Microsoft.UI.Xaml" }

            $candidates = @(Get-ChildItem -LiteralPath $sourceRoot -Recurse -File | Where-Object { $_.FullName -match ("[\\/]Dependencies[\\/]" + $architecture + "[\\/]") -and $_.Extension -in ".appx", ".msix" })
            $resolved = @{}
            foreach ($candidate in $candidates) {
              $depUnpack = Join-Path $env:RUNNER_TEMP ("VelocityCopy-Dep-" + $architecture + "-" + [Guid]::NewGuid().ToString("N"))
              & $makeappx unpack /p $candidate.FullName /d $depUnpack /o | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect dependency package $($candidate.Name)" }
              [xml]$depManifest = Get-Content -LiteralPath (Join-Path $depUnpack "AppxManifest.xml") -Raw
              $name = [string]$depManifest.Package.Identity.Name
              if ($requiredNames -contains $name) {
                if ($resolved.ContainsKey($name)) { throw "Multiple $architecture packages resolve dependency Identity Name $name" }
                $resolved[$name] = $candidate.FullName
              }
              Remove-Item -LiteralPath $depUnpack -Recurse -Force -ErrorAction SilentlyContinue
            }

            $missing = @($requiredNames | Where-Object { -not $resolved.ContainsKey($_) })
            if ($missing.Count -gt 0) { throw "$architecture dependency graph is incomplete: $($missing -join ', ')" }
            $dependencyStage = Join-Path $payload ("Dependencies\" + $architecture)
            New-Item -ItemType Directory -Force -Path $dependencyStage | Out-Null
            foreach ($name in $requiredNames) {
              Write-Host "Staging $architecture dependency Identity Name: $name"
              Copy-Item -LiteralPath $resolved[$name] -Destination $dependencyStage -Force
            }
          }

          Copy-Item -LiteralPath "tools/Install-VelocityCopy-Test.ps1" -Destination $payload -Force

          $stagedPackages = @(Get-ChildItem -LiteralPath (Join-Path $payload "Dependencies") -Recurse -File | Where-Object { $_.Extension -in ".appx", ".msix" })
          foreach ($staged in $stagedPackages) {
            $auditUnpack = Join-Path $env:RUNNER_TEMP ("VelocityCopy-StagingAudit-" + [Guid]::NewGuid().ToString("N"))
            & $makeappx unpack /p $staged.FullName /d $auditUnpack /o | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not audit staged package $($staged.Name)" }
            [xml]$stagedManifest = Get-Content -LiteralPath (Join-Path $auditUnpack "AppxManifest.xml") -Raw
            $stagedName = [string]$stagedManifest.Package.Identity.Name
            Write-Host "Staged dependency Identity Name: $stagedName"
            if ($stagedName -like "Microsoft.UI.Xaml*") { throw "Staging audit found forbidden dependency $stagedName" }
            Remove-Item -LiteralPath $auditUnpack -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build single-file Windows installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }

          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe was not found" }

          $payload = (Resolve-Path "artifacts/VelocityCopy-InstallerPayload").Path
          $outputDir = "artifacts/installer"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $output = Join-Path (Resolve-Path $outputDir).Path "VelocityCopy-Setup.exe"

          if (-not $env:VELOCITYCOPY_PACKAGE_VERSION) { throw "Stamped VelocityCopy package version is unavailable" }
          & $makensis "/DPAYLOAD_DIR=$payload" "/DOUTPUT_FILE=$output" "/DDISPLAY_VERSION=$env:VELOCITYCOPY_PACKAGE_VERSION" "tools/VelocityCopy-Test-Installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "VelocityCopy setup generation failed" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "VelocityCopy-Setup.exe was not produced" }

      - name: Smoke install single-file Windows installer
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Resolve-Path "artifacts/installer/VelocityCopy-Setup.exe").Path
          $uninstaller = Join-Path $env:ProgramFiles "VelocityCopy\Uninstall.exe"
          $installLog = Join-Path $env:TEMP "VelocityCopy-Install.log"
          Remove-Item -LiteralPath $installLog -Force -ErrorAction SilentlyContinue

          function Show-DeploymentDiagnostics {
            if (Test-Path -LiteralPath $installLog -PathType Leaf) {
              Write-Host "::group::VelocityCopy installer diagnostic log"
              Get-Content -LiteralPath $installLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              Write-Host "::endgroup::"
            }

            Write-Host "::group::Recent AppXDeploymentServer events"
            try {
              Get-WinEvent -LogName "Microsoft-Windows-AppXDeploymentServer/Operational" -MaxEvents 30 -ErrorAction Stop |
                Select-Object TimeCreated, Id, LevelDisplayName, Message |
                Format-List |
                Out-String -Width 220 |
                Write-Host
            } catch {
              Write-Host "AppX deployment event log unavailable: $($_.Exception.Message)"
            }
            Write-Host "::endgroup::"
          }

          try {
            $install = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              Show-DeploymentDiagnostics
              throw "VelocityCopy-Setup.exe silent install failed with exit code $($install.ExitCode)"
            }

            $installed = Get-AppxPackage -Name "ReinierTutoriales.VelocityCopy" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $installed) {
              Show-DeploymentDiagnostics
              throw "VelocityCopy package is absent after setup smoke installation"
            }
            if ($installed.PackageFamilyName -notmatch '^ReinierTutoriales\.VelocityCopy_') {
              throw "Unexpected VelocityCopy package family: $($installed.PackageFamilyName)"
            }
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw "VelocityCopy uninstaller was not produced by setup"
            }
            Write-Host "Setup smoke-installed $($installed.PackageFullName)"
          }
          finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) {
                Show-DeploymentDiagnostics
                throw "VelocityCopy uninstaller silent run failed with exit code $($uninstall.ExitCode)"
              }
            }
          }

          $remaining = Get-AppxPackage -Name "ReinierTutoriales.VelocityCopy" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($remaining) {
            throw "VelocityCopy package remains installed after setup smoke uninstall"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VelocityCopy-Setup
          path: artifacts/installer/VelocityCopy-Setup.exe
          if-no-files-found: error
          retention-days: 14
