name: Windows Package

on:
  workflow_dispatch:
    inputs:
      geometry_probe:
        description: 'Enable diagnostic geometry logging (not for distribution)'
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            platform: x64
            setup_name: VelocityCopy-Setup-x64.exe
            smoke: true
          - arch: arm64
            cmake_arch: ARM64
            platform: ARM64
            setup_name: VelocityCopy-Setup-ARM64.exe
            smoke: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version
        shell: pwsh
        run: |
          $header = Get-Content src/ui/VelocityCopy.UI/Version.h -Raw
          function Read-VersionPart([string]$name) {
            $match = [regex]::Match($header, "#define\s+$name\s+(\d+)")
            if (-not $match.Success) { throw "Version.h is missing $name" }
            return [int]$match.Groups[1].Value
          }
          $major = Read-VersionPart "VELOCITYCOPY_VERSION_MAJOR"
          $minor = Read-VersionPart "VELOCITYCOPY_VERSION_MINOR"
          $patch = Read-VersionPart "VELOCITYCOPY_VERSION_PATCH"
          $build = Read-VersionPart "VELOCITYCOPY_VERSION_BUILD"
          $version = "$major.$minor.$patch.$build"
          "VELOCITYCOPY_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build core
        shell: pwsh
        run: |
          cmake -S . -B build/${{ matrix.cmake_arch }} -A ${{ matrix.cmake_arch }} -DVELOCITYCOPY_HYBRID_CRT=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed for ${{ matrix.arch }}" }
          cmake --build build/${{ matrix.cmake_arch }} --config Release --target velocitycopy_core VelocityCopyShell VelocityCopyStartupHelper --parallel
          if ($LASTEXITCODE -ne 0) { throw "Core build failed for ${{ matrix.arch }}" }

      - name: Build self-contained WinUI
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }
          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:AppxPackage=false /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:EnableMsixTooling=true /p:SkipVelocityCopyCoreBuild=true /p:VelocityCopyGeometryProbe=${{ github.event_name == 'workflow_dispatch' && inputs.geometry_probe || false }} /p:VelocityCopyBuildSha=${{ github.event.pull_request.head.sha || github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "Self-contained WinUI ${{ matrix.arch }} build failed" }

      - name: Smoke launch built x64 output
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter VelocityCopy.WinUI.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Build tree executable candidates:"
            Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter '*.exe' | ForEach-Object { Write-Host $_.FullName }
            throw "Built x64 executable was not found"
          }
          Write-Host "Launching build output directly from $($exe.Directory.FullName)"
          $env:VELOCITYCOPY_DIAGNOSTIC_LOG = Join-Path $env:RUNNER_TEMP "velocitycopy-unhandled.log"
          Remove-Item $env:VELOCITYCOPY_DIAGNOSTIC_LOG -ErrorAction SilentlyContinue
          $app = Start-Process $exe.FullName -WorkingDirectory $exe.Directory.FullName -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $env:VELOCITYCOPY_DIAGNOSTIC_LOG) { Write-Host "VelocityCopy diagnostic log:"; Get-Content $env:VELOCITYCOPY_DIAGNOSTIC_LOG }
            $exitCode = $app.ExitCode
            $hexCode = ('0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$exitCode), 0)))
            throw "Built VelocityCopy output exits before packaging: $exitCode ($hexCode)"
          }
          Stop-Process -Id $app.Id -Force

      - name: Stage autonomous payload
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $exe = Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter VelocityCopy.WinUI.exe |
            Where-Object {
              $_.FullName -match "[\\/]$platform[\\/].*[\\/]Release[\\/]" -or
              $_.FullName -match "[\\/]Release[\\/].*[\\/]$platform[\\/]"
            } |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter VelocityCopy.WinUI.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "VelocityCopy.WinUI.exe was not produced for ${{ matrix.arch }}" }
          $source = $exe.Directory.FullName
          $payload = "artifacts/installer-payload-${{ matrix.arch }}"
          Remove-Item $payload -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $payload | Out-Null
          Get-ChildItem $source -File | Where-Object { $_.Extension -notin '.pdb','.ilk','.lib','.exp','.iobj','.ipdb' } | Copy-Item -Destination $payload
          Get-ChildItem $source -Directory | ForEach-Object { Copy-Item $_.FullName -Destination $payload -Recurse }
          if (-not (Test-Path "$payload/VelocityCopy.WinUI.exe")) { throw "Installer payload is missing executable" }
          $shellDll = Join-Path $payload "VelocityCopy.Shell.dll"
          if (-not (Test-Path $shellDll)) {
            $builtShell = "build/${{ matrix.cmake_arch }}/Release/VelocityCopy.Shell.dll"
            if (Test-Path $builtShell) {
              Copy-Item $builtShell -Destination $shellDll
            }
          }
          if (-not (Test-Path $shellDll)) { throw "Installer payload is missing VelocityCopy.Shell.dll" }

          $startupHelper = Join-Path $payload "VelocityCopy.StartupHelper.exe"
          if (-not (Test-Path $startupHelper)) {
            $builtHelper = "build/${{ matrix.cmake_arch }}/Release/VelocityCopy.StartupHelper.exe"
            if (Test-Path $builtHelper) {
              Copy-Item $builtHelper -Destination $startupHelper
            }
          }
          if (-not (Test-Path $startupHelper)) { throw "Installer payload is missing VelocityCopy.StartupHelper.exe" }

          function Get-PeMachine([string]$path) {
            $stream = [System.IO.File]::OpenRead($path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "$path is not a PE image" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0 -or $peOffset -gt ($stream.Length - 6)) { throw "$path has an invalid PE header offset" }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$path has no PE signature" }
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }

          $expectedMachine = if ("${{ matrix.platform }}" -eq "ARM64") { 0xAA64 } else { 0x8664 }
          foreach ($binary in @("$payload/VelocityCopy.WinUI.exe", $shellDll, $startupHelper)) {
            $machine = Get-PeMachine $binary
            if ($machine -ne $expectedMachine) {
              throw ("Architecture mismatch for {0}: expected PE machine 0x{1:X4}, got 0x{2:X4}" -f $binary, $expectedMachine, $machine)
            }
          }

          $forbidden = @(Get-ChildItem $payload -Recurse -File | Where-Object { $_.Extension -in '.msix','.msixbundle','.appx','.appxbundle','.cer','.pfx' })
          if ($forbidden.Count) { throw "Installer payload contains package/certificate artifacts" }
          # Exclude build-only products recursively, including nested output folders.
          Get-ChildItem $payload -Recurse -File |
            Where-Object { $_.Extension -in '.pdb','.ilk','.lib','.exp','.iobj','.ipdb' } |
            Remove-Item -Force
          foreach ($unused in @('Microsoft.Windows.AI.Text.dll','Microsoft.Windows.AI.MachineLearning.dll','onnxruntime.dll','Microsoft.Windows.Search.dll','Microsoft.Windows.Widgets.dll')) {
            if (Test-Path (Join-Path $payload $unused)) { throw "Unused SDK component is still staged: $unused" }
          }
          $files = @(Get-ChildItem $payload -Recurse -File)
          $size = ($files | Measure-Object Length -Sum).Sum
          $inventory = @($files | Sort-Object FullName | ForEach-Object {
            [ordered]@{ path = [IO.Path]::GetRelativePath((Resolve-Path $payload).Path, $_.FullName); bytes = $_.Length }
          })
          [ordered]@{ architecture = '${{ matrix.arch }}'; bytes = $size; files = $inventory } |
            ConvertTo-Json -Depth 4 | Set-Content "artifacts/payload-inventory-${{ matrix.arch }}.json" -Encoding utf8
          Write-Host ("Self-contained ${{ matrix.arch }} payload: {0:N1} MB ({1} files)" -f ($size / 1MB), $files.Count)
          $files | Sort-Object Length -Descending | Select-Object -First 15 Name,Length | Format-Table

      - name: Upload payload size inventory
        uses: actions/upload-artifact@v6
        with:
          name: VelocityCopy-payload-inventory-${{ matrix.arch }}-${{ github.run_id }}
          path: artifacts/payload-inventory-${{ matrix.arch }}.json
          retention-days: 7

      - name: Validate staged application icon
        shell: pwsh
        run: |
          $payload = (Resolve-Path "artifacts/installer-payload-${{ matrix.arch }}").Path
          $ico = Join-Path $payload "Assets/VelocityCopy.ico"
          if ((Get-FileHash $ico).Hash -ne (Get-FileHash src/ui/VelocityCopy.UI/Assets/VelocityCopy.ico).Hash) { throw "Staged icon is stale" }
          pwsh -NoProfile -File tools/ci/Assert-AppIcon.ps1 -ExePath "$payload/VelocityCopy.WinUI.exe" -IcoPath $ico
          if ($LASTEXITCODE -ne 0) { throw "Staged executable icon validation failed" }

      - name: Verify startup helper across two real profiles
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $payload = (Resolve-Path "artifacts/installer-payload-x64").Path
          $helper = Join-Path $payload "VelocityCopy.StartupHelper.exe"
          $publicHelper = Join-Path $env:PUBLIC "VelocityCopy.StartupHelper.ProfileTest.exe"
          Copy-Item -LiteralPath $helper -Destination $publicHelper -Force
          $app = Join-Path $payload "VelocityCopy.WinUI.exe"
          try {
            pwsh -NoProfile -File tools/Test-StartupHelperProfiles.ps1 -HelperPath $publicHelper -ApplicationPath $app
            if ($LASTEXITCODE -ne 0) { throw "Two-profile startup registration test failed" }
          } finally {
            Remove-Item $publicHelper -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise Authenticode pipeline with ephemeral certificate
        if: ${{ matrix.smoke }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $payload = (Resolve-Path "artifacts/installer-payload-x64").Path
          $fixture = Join-Path $env:RUNNER_TEMP "velocitycopy-signing-payload-fixture"
          Remove-Item $fixture -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $fixture | Out-Null
          try {
            foreach ($name in @("VelocityCopy.WinUI.exe", "VelocityCopy.Shell.dll", "VelocityCopy.StartupHelper.exe")) {
              $copy = Join-Path $fixture $name
              Copy-Item -LiteralPath (Join-Path $payload $name) -Destination $copy
              & ./tools/ci/Test-AuthenticodePipeline.ps1 -Path $copy
            }
          } finally {
            Remove-Item $fixture -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Sign stable-tag payload
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.VELOCITYCOPY_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.VELOCITYCOPY_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Stable tags require VELOCITYCOPY_SIGNING_PFX_BASE64 and VELOCITYCOPY_SIGNING_PFX_PASSWORD"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "velocitycopy-stable-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $payload = (Resolve-Path "artifacts/installer-payload-${{ matrix.arch }}").Path
            foreach ($name in @("VelocityCopy.WinUI.exe", "VelocityCopy.Shell.dll", "VelocityCopy.StartupHelper.exe")) {
              $binary = Join-Path $payload $name
              & ./tools/ci/Sign-VelocityCopyBinary.ps1 -Path $binary -PfxPath $pfx -PfxPassword $env:SIGNING_PFX_PASSWORD
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Validate application PRI in payload
        shell: pwsh
        run: |
          $payload = (Resolve-Path "artifacts/installer-payload-${{ matrix.arch }}").Path
          pwsh -NoProfile -File tools/ci/Assert-PriResource.ps1 -RootPath $payload -EvidencePath "artifacts/pri-evidence-${{ matrix.arch }}/payload" -Key RecoveryRestoreError -LanguagesCsv 'en-US,es-ES'
          if ($LASTEXITCODE -ne 0) { throw "Payload PRI validation failed for ${{ matrix.arch }}" }

      - name: Exercise PRI validator with real fixtures
        shell: pwsh
        run: |
          $sourcePri = (Resolve-Path "artifacts/installer-payload-${{ matrix.arch }}/VelocityCopy.WinUI.pri").Path
          $fixtures = "artifacts/pri-fixtures-${{ matrix.arch }}"
          Remove-Item $fixtures -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$fixtures/positive" | Out-Null
          Copy-Item $sourcePri "$fixtures/positive/VelocityCopy.WinUI.pri"
          pwsh -NoProfile -File tools/ci/Assert-PriResource.ps1 -RootPath "$fixtures/positive" -EvidencePath "artifacts/pri-evidence-${{ matrix.arch }}/fixture-positive" -Key RecoveryRestoreError -LanguagesCsv 'en-US,es-ES'
          if ($LASTEXITCODE -ne 0) { throw 'Positive PRI fixture was rejected' }

          New-Item -ItemType Directory -Force "$fixtures/negative" | Out-Null
          Copy-Item $sourcePri "$fixtures/negative/VelocityCopy.WinUI.pri"
          # Each negative case must fail for ITS reason. A non-zero exit alone is
          # not proof: a missing makepri or a broken dump also exits non-zero.
          $negatives = @(
            @{ Name = 'missing-key';      Key = '__VelocityCopyMissingFixtureKey__'; Languages = 'en-US,es-ES';
               Reason = 'PRI dump does not contain resource key __VelocityCopyMissingFixtureKey__' },
            @{ Name = 'missing-language'; Key = 'RecoveryRestoreError';              Languages = 'en-US,es-ES,fr-FR';
               Reason = 'PRI resource RecoveryRestoreError has no candidate qualified for fr-FR' }
          )
          foreach ($case in $negatives) {
            $output = pwsh -NoProfile -File tools/ci/Assert-PriResource.ps1 -RootPath "$fixtures/negative" -EvidencePath "artifacts/pri-evidence-${{ matrix.arch }}/fixture-negative-$($case.Name)" -Key $case.Key -LanguagesCsv $case.Languages 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { throw "Negative PRI case '$($case.Name)' was incorrectly accepted" }
            if (-not $output.Contains($case.Reason)) {
              Write-Host $output
              throw "Negative PRI case '$($case.Name)' failed for an unexpected reason"
            }
            Write-Host "Negative PRI case '$($case.Name)' rejected as expected: $($case.Reason)"
          }
          $global:LASTEXITCODE = 0

      - name: Cache pinned NSIS
        id: cache-nsis
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/nsis-3.13.zip
          key: nsis-3.13-${{ matrix.arch }}-ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8

      - name: Fetch and verify pinned NSIS
        shell: pwsh
        run: |
          $version = "3.13"
          $expected = "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8"
          $zip = Join-Path $env:RUNNER_TEMP "nsis-$version.zip"
          if (-not (Test-Path $zip)) {
            # Official NSIS distribution; the SHA-256 below pins the exact archive.
            $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip"
            & curl.exe -L --fail --retry 4 --retry-all-errors --output $zip $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw "Pinned NSIS download failed" }
          }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "NSIS SHA256 mismatch: expected $expected, got $actual" }
          Write-Host "Verified NSIS $version SHA256: $actual"
          $tools = Join-Path $env:RUNNER_TEMP "nsis-$version"
          Remove-Item $tools -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $tools -Force
          $makensis = Get-ChildItem $tools -Recurse -File -Filter makensis.exe | Select-Object -First 1
          if (-not $makensis) { throw "Pinned NSIS $version does not contain makensis.exe" }
          "NSIS_MAKENSIS=$($makensis.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using pinned NSIS $version at $($makensis.FullName)"

      - name: Build classic installer
        shell: pwsh
        run: |
          if (-not $env:NSIS_MAKENSIS -or -not (Test-Path $env:NSIS_MAKENSIS)) { throw "Portable NSIS is unavailable" }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $payload = (Resolve-Path artifacts/installer-payload-${{ matrix.arch }}).Path
          $output = Join-Path (Resolve-Path artifacts/installer).Path "${{ matrix.setup_name }}"
          & $env:NSIS_MAKENSIS /INPUTCHARSET UTF8 "/DPAYLOAD_DIR=$payload" "/DOUTPUT_FILE=$output" "/DDISPLAY_VERSION=$env:VELOCITYCOPY_VERSION" "/DPAYLOAD_ARCH=${{ matrix.platform }}" tools/VelocityCopy-Test-Installer.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw "Classic ${{ matrix.arch }} installer build failed" }

      - name: Exercise installer Authenticode with ephemeral certificate
        if: ${{ matrix.smoke }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/installer/${{ matrix.setup_name }}").Path
          $fixture = Join-Path $env:RUNNER_TEMP "VelocityCopy-Setup-SigningFixture.exe"
          Copy-Item -LiteralPath $setup -Destination $fixture -Force
          try {
            & ./tools/ci/Test-AuthenticodePipeline.ps1 -Path $fixture
          } finally {
            Remove-Item $fixture -Force -ErrorAction SilentlyContinue
          }

      - name: Sign stable-tag installer
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.VELOCITYCOPY_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.VELOCITYCOPY_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Stable tags require Authenticode signing secrets"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "velocitycopy-stable-signing.pfx"
          $setup = (Resolve-Path "artifacts/installer/${{ matrix.setup_name }}").Path
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            & ./tools/ci/Sign-VelocityCopyBinary.ps1 -Path $setup -PfxPath $pfx -PfxPassword $env:SIGNING_PFX_PASSWORD
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke upgrade from v1.1.0 with write-locked shell DLL
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $legacy = Join-Path $env:RUNNER_TEMP "VelocityCopy-Setup-x64-v1.1.0.exe"
          $legacyUrl = "https://github.com/ReinierTutoriales/VelocityCopy/releases/download/v1.1.0/VelocityCopy-Setup-x64-v1.1.0.exe"
          & curl.exe -L --fail --retry 4 --retry-all-errors --output $legacy $legacyUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $legacy)) { throw "Unable to download v1.1.0 upgrade fixture" }
          $expected = "21647db6ca0b98b8c523c7f68ec56fb14b0151d536d97d5eb3677d17a6da22a7"
          $actual = (Get-FileHash -LiteralPath $legacy -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "v1.1.0 fixture SHA256 mismatch: $actual" }

          $legacyInstall = Start-Process $legacy -ArgumentList "/S" -Wait -PassThru
          if ($legacyInstall.ExitCode -ne 0) { throw "v1.1.0 install failed: $($legacyInstall.ExitCode)" }

          $root = Join-Path $env:ProgramFiles "VelocityCopy"
          $shellDll = Join-Path $root "VelocityCopy.Shell.dll"
          if (-not (Test-Path $shellDll)) { throw "v1.1.0 shell DLL is missing" }
          # Seed a retired component and unrelated user file to check targeted cleanup.
          $retiredFixture = Join-Path $root 'Microsoft.Windows.AI.Text.dll'
          if (-not (Test-Path $retiredFixture)) { Set-Content $retiredFixture 'retired SDK fixture' }
          $userFixture = Join-Path $root 'upgrade-preserve-user-file.txt'
          Set-Content $userFixture 'preserve me'

          $holderScript = Join-Path $env:RUNNER_TEMP "hold-velocitycopy-shell.ps1"
          @(
            '$member = ''[DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr CreateFileW(string path, uint access, uint share, IntPtr security, uint creation, uint flags, IntPtr templateFile); [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr handle);'''
            'Add-Type -Namespace VelocityCopyNative -Name ShellHolder -MemberDefinition $member'
            '# Read access, share read + delete, but deliberately do not share write.'
            '# The canonical DLL cannot be overwritten while this handle exists,'
            '# yet Windows may rename it so the installer can retire the generation.'
            '$handle = [VelocityCopyNative.ShellHolder]::CreateFileW($args[0], 0x80000000, 0x00000005, [IntPtr]::Zero, 3, 0x80, [IntPtr]::Zero)'
            'if ($handle -eq [IntPtr](-1)) {'
            '  $error = [Runtime.InteropServices.Marshal]::GetLastWin32Error()'
            '  Write-Error "CreateFileW lock fixture failed for $($args[0]) with Win32 error $error"'
            '  exit 41'
            '}'
            'try { Start-Sleep -Seconds 180 } finally { [void][VelocityCopyNative.ShellHolder]::CloseHandle($handle) }'
          ) | Set-Content -LiteralPath $holderScript -Encoding UTF8

          $holder = Start-Process powershell.exe -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $holderScript, $shellDll
          ) -PassThru
          Start-Sleep -Seconds 3
          $holder.Refresh()
          if ($holder.HasExited) { throw "Unable to keep the v1.1.0 shell DLL loaded; holder exit $($holder.ExitCode)" }

          try {
            $setup = (Resolve-Path artifacts/installer/${{ matrix.setup_name }}).Path
            $upgrade = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
            if ($upgrade.ExitCode -ne 0) { throw "Upgrade over write-locked v1.1.0 shell DLL failed: $($upgrade.ExitCode)" }
            if (-not (Test-Path $shellDll)) { throw "Shell DLL disappeared after upgrade" }

            if (Test-Path $retiredFixture) { throw "Upgrade left the retired AI component behind" }
            if ((Get-Content $userFixture -Raw).Trim() -ne 'preserve me') { throw "Upgrade altered an unrelated file" }
            $payloadRoot = (Resolve-Path "artifacts/installer-payload-x64").Path
            $retiredNames = [regex]::Matches((Get-Content tools/Retired-Sdk-Components.nsh -Raw), '!insertmacro RetireUnusedSdkFile "([^"\r\n]+)"')
            foreach ($match in $retiredNames) {
              $name = $match.Groups[1].Value
              if (-not (Test-Path (Join-Path $payloadRoot $name)) -and (Test-Path (Join-Path $root $name))) {
                throw "Upgrade retained obsolete SDK file: $name"
              }
            }
            $installedExe = Join-Path $root "VelocityCopy.WinUI.exe"
            $payloadExe = Join-Path $payloadRoot "VelocityCopy.WinUI.exe"
            $payloadShell = Join-Path $payloadRoot "VelocityCopy.Shell.dll"

            $expectedExeHash = (Get-FileHash -LiteralPath $payloadExe -Algorithm SHA256).Hash
            $actualExeHash = (Get-FileHash -LiteralPath $installedExe -Algorithm SHA256).Hash
            if ($actualExeHash -ne $expectedExeHash) {
              throw "Upgrade did not replace VelocityCopy.WinUI.exe with the current payload"
            }

            $expectedShellHash = (Get-FileHash -LiteralPath $payloadShell -Algorithm SHA256).Hash
            $actualShellHash = (Get-FileHash -LiteralPath $shellDll -Algorithm SHA256).Hash
            if ($actualShellHash -ne $expectedShellHash) {
              throw "Upgrade did not replace the loaded VelocityCopy.Shell.dll with the current payload"
            }
            & ./tools/Test-ShellRegistration.ps1 -Phase Installed
            $installedIcon = Join-Path $root "Assets/VelocityCopy.ico"
            if ((Get-FileHash $installedIcon).Hash -ne (Get-FileHash src/ui/VelocityCopy.UI/Assets/VelocityCopy.ico).Hash) {
              throw "Upgrade retained a stale icon asset"
            }

            # Keep the first retired generation mapped, then map the newly
            # installed canonical DLL as a second generation. A second upgrade
            # must retire it to another unique path instead of colliding with
            # the still-locked first retired image.
            $holder2 = Start-Process powershell.exe -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $holderScript, $shellDll
            ) -PassThru
            Start-Sleep -Seconds 3
            $holder2.Refresh()
            if ($holder2.HasExited) {
              throw "Unable to keep the current shell DLL loaded for second-upgrade smoke; holder exit $($holder2.ExitCode)"
            }
            try {
              $upgrade2 = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
              if ($upgrade2.ExitCode -ne 0) {
                throw "Second upgrade with two write-locked shell generations failed: $($upgrade2.ExitCode)"
              }
              $actualShellHash2 = (Get-FileHash -LiteralPath $shellDll -Algorithm SHA256).Hash
              if ($actualShellHash2 -ne $expectedShellHash) {
                throw "Second upgrade did not leave the current VelocityCopy.Shell.dll at the canonical path"
              }
              $holder.Refresh()
              $holder2.Refresh()
              if ($holder.HasExited -or $holder2.HasExited) {
                throw "A write-locked shell generation was unexpectedly terminated by the second upgrade"
              }
            } finally {
              Stop-Process -Id $holder2.Id -Force -ErrorAction SilentlyContinue
            }
          } finally {
            Stop-Process -Id $holder.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke install classic x64 installer
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $setup = (Resolve-Path artifacts/installer/${{ matrix.setup_name }}).Path
          & ./tools/Test-ShellRegistration.ps1 -Phase SeedLegacy
          $install = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $root = Join-Path $env:ProgramFiles "VelocityCopy"
          $exe = Join-Path $root "VelocityCopy.WinUI.exe"
          $uninstaller = Join-Path $root "Uninstall.exe"
          $shellDll = Join-Path $root "VelocityCopy.Shell.dll"
          if (-not (Test-Path $exe)) { throw "Installed executable is missing" }
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing" }
          if (-not (Test-Path $shellDll)) { throw "Installed shell extension is missing" }
          $installedPri = Join-Path $root "VelocityCopy.WinUI.pri"
          if (-not (Test-Path $installedPri)) { throw "Installed VelocityCopy.WinUI.pri is missing beside VelocityCopy.WinUI.exe" }
          if (Test-Path (Join-Path $root "resources.pri")) { throw "Legacy resources.pri must not be installed" }
          pwsh -NoProfile -File tools/ci/Assert-PriResource.ps1 -RootPath $root -EvidencePath "artifacts/pri-evidence-${{ matrix.arch }}/installed" -Key RecoveryRestoreError -LanguagesCsv 'en-US,es-ES'
          if ($LASTEXITCODE -ne 0) { throw "Installed PRI validation failed" }
          & ./tools/Test-ShellRegistration.ps1 -Phase Installed
          $ico = Join-Path $root "Assets/VelocityCopy.ico"
          if ((Get-FileHash $ico).Hash -ne (Get-FileHash src/ui/VelocityCopy.UI/Assets/VelocityCopy.ico).Hash) { throw "Installed icon is stale" }
          foreach ($binary in @($exe, $uninstaller, $setup)) {
            pwsh -NoProfile -File tools/ci/Assert-AppIcon.ps1 -ExePath $binary -IcoPath $ico -FirstGroup
            if ($LASTEXITCODE -ne 0) { throw "Installed/setup icon validation failed: $binary" }
          }
          $displayIcon = (Get-ItemProperty 'HKLM:/Software/Microsoft/Windows/CurrentVersion/Uninstall/VelocityCopy').DisplayIcon
          if ($displayIcon -ne ('"' + $exe + '",0')) { throw "Installed Apps icon registration is incorrect" }
          $shortcutPath = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs/VelocityCopy/VelocityCopy.lnk'
          $wsh = New-Object -ComObject WScript.Shell
          $shortcut = $wsh.CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ne $exe -or $shortcut.IconLocation -ne ($exe + ',0')) { throw "Start Menu icon/target registration is incorrect" }

          $app = Start-Process $exe -WorkingDirectory $env:TEMP -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $env:VELOCITYCOPY_DIAGNOSTIC_LOG) { Write-Host "VelocityCopy diagnostic log:"; Get-Content $env:VELOCITYCOPY_DIAGNOSTIC_LOG }
            $exitCode = $app.ExitCode
            $hexCode = ('0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$exitCode), 0)))
            Write-Host "VelocityCopy exited with $exitCode ($hexCode)"
            Write-Host "Installed payload files:"
            Get-ChildItem $root -Recurse -File | Sort-Object FullName | ForEach-Object { Write-Host $_.FullName }
            Write-Host "Recent Application event log entries for VelocityCopy / XAML / Windows App Runtime:"
            Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'VelocityCopy|Microsoft.UI.Xaml|WindowsAppRuntime|CoreMessaging|0xc000027b' } |
              Select-Object -First 20 TimeCreated, Id, ProviderName, LevelDisplayName, Message |
              Format-List | Out-String -Width 4096 | Write-Host
            throw "Installed VelocityCopy exited during launch smoke test with code $exitCode ($hexCode)"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "Installed payload launched successfully at $root"

      - name: Smoke uninstall classic x64 installer
        if: ${{ matrix.smoke }}
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles "VelocityCopy"
          $uninstaller = Join-Path $root "Uninstall.exe"
          $p = Start-Process $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $root) { throw "Installation directory remains after uninstall" }
          & ./tools/Test-ShellRegistration.ps1 -Phase Uninstalled

      - name: Upload PRI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VelocityCopy-PRI-evidence-${{ matrix.arch }}-${{ github.run_id }}
          path: artifacts/pri-evidence-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validated installer
        uses: actions/upload-artifact@v6
        with:
          name: VelocityCopy-Setup-${{ matrix.arch }}-${{ env.VELOCITYCOPY_VERSION }}
          path: artifacts/installer/${{ matrix.setup_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload launch diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VelocityCopy-launch-diagnostic-package-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/velocitycopy-unhandled.log
          if-no-files-found: warn
          retention-days: 7
