name: Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package.yml"
      - "src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj"
    tags:
      - "v*"

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build/x64 -A x64

      - name: Build core
        run: cmake --build build/x64 --config Release --parallel

      - name: Test core
        run: ctest --test-dir build/x64 -C Release --output-on-failure

      - name: Stamp test package version
        shell: pwsh
        run: |
          $manifest = "src/ui/VelocityCopy.UI/Package.appxmanifest"
          $version = "0.20.$env:GITHUB_RUN_NUMBER.0"
          $content = Get-Content -LiteralPath $manifest -Raw
          $content = [regex]::Replace(
            $content,
            '(<Identity\s+Name="ReinierTutoriales\.VelocityCopy"\s+Publisher="CN=ReinierTutoriales"\s+Version=")[^"]+(")',
            ('${1}' + $version + '${2}')
          )
          Set-Content -LiteralPath $manifest -Value $content -Encoding utf8

          $stamped = Get-Content -LiteralPath $manifest -Raw
          if ($stamped -notmatch ('Version="' + [regex]::Escape($version) + '"')) {
            throw "Failed to stamp VelocityCopy package version $version"
          }
          "VELOCITYCOPY_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VelocityCopy test package version: $version"

      - name: Build WinUI 3 x64 Release and MSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          $packageDir = Join-Path (Resolve-Path ".").Path "artifacts\AppPackages\"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir"
          if ($LASTEXITCODE -ne 0) { throw "WinUI/MSIX build failed with exit code $LASTEXITCODE" }

      - name: Build WinUI 3 ARM64 Release and MSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          $packageDir = Join-Path (Resolve-Path ".").Path "artifacts\AppPackages-ARM64\"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir"
          if ($LASTEXITCODE -ne 0) { throw "WinUI/ARM64 MSIX build failed with exit code $LASTEXITCODE" }

          $armPackages = @(
            Get-ChildItem -LiteralPath $packageDir -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          if ($armPackages.Count -ne 1) {
            throw "Expected exactly one ARM64 VelocityCopy MSIX package, found $($armPackages.Count)"
          }

      - name: Bundle and sign Windows test package
        shell: pwsh
        timeout-minutes: 5
        run: |
          $x64Packages = @(
            Get-ChildItem -Path artifacts/AppPackages -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          $arm64Packages = @(
            Get-ChildItem -Path artifacts/AppPackages-ARM64 -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          if ($x64Packages.Count -ne 1 -or $arm64Packages.Count -ne 1) {
            throw "Expected exactly one x64 and one ARM64 VelocityCopy MSIX package."
          }

          $bundleInput = Join-Path (Resolve-Path ".").Path "artifacts\BundleInput"
          New-Item -ItemType Directory -Force -Path $bundleInput | Out-Null
          Copy-Item -LiteralPath $x64Packages[0].FullName -Destination (Join-Path $bundleInput "VelocityCopy-x64.msix") -Force
          Copy-Item -LiteralPath $arm64Packages[0].FullName -Destination (Join-Path $bundleInput "VelocityCopy-arm64.msix") -Force

          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*" -Directory |
            Sort-Object Name -Descending |
            Where-Object {
              Test-Path -LiteralPath (Join-Path $_.FullName "x64\makeappx.exe")
            } |
            Select-Object -First 1
          if (-not $sdkBin) { throw "Windows SDK MakeAppx.exe was not found" }
          $makeappx = Join-Path $sdkBin.FullName "x64\makeappx.exe"
          $signtool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          if (-not (Test-Path -LiteralPath $signtool -PathType Leaf)) { throw "SignTool.exe was not found" }

          $bundleDir = Join-Path (Resolve-Path ".").Path "artifacts\Bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $bundle = Join-Path $bundleDir "VelocityCopy.msixbundle"
          & $makeappx bundle /d $bundleInput /p $bundle /o
          if ($LASTEXITCODE -ne 0) { throw "MSIX bundle creation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "VelocityCopy.msixbundle was not produced" }

          $plainPassword = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $plainPassword -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=ReinierTutoriales" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            ) `
            -FriendlyName "VelocityCopy CI Test Signing"

          $pfx = Join-Path $env:RUNNER_TEMP "VelocityCopy-Test.pfx"
          $cer = Join-Path $bundleDir "VelocityCopy-Test.cer"
          try {
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null

            & $signtool sign /fd SHA256 /a /f $pfx /p $plainPassword $bundle
            if ($LASTEXITCODE -ne 0) { throw "Bundle signing failed with exit code $LASTEXITCODE" }

            # The CI signer is intentionally self-signed and is not trusted on the runner yet.
            # Verify package integrity/signature without requiring a machine trust-chain decision here;
            # the installer smoke test separately proves trust installation and Add-AppxPackage.
            & $signtool verify /pa /v /kp $bundle
            $verifyExitCode = $LASTEXITCODE
            if ($verifyExitCode -ne 0) {
              $signature = Get-AuthenticodeSignature -FilePath $bundle
              if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
                throw "Bundle signature verification failed with exit code $verifyExitCode"
              }
            }

            $signature = Get-AuthenticodeSignature -FilePath $bundle
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Unexpected signer certificate for VelocityCopy.msixbundle"
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
          }

      - name: Stage universal installer payload
        shell: pwsh
        run: |
          $payload = "artifacts/VelocityCopy-InstallerPayload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          $bundleRoot = (Resolve-Path "artifacts/Bundle").Path
          $bundle = Join-Path $bundleRoot "VelocityCopy.msixbundle"
          $certificate = Join-Path $bundleRoot "VelocityCopy-Test.cer"
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "VelocityCopy.msixbundle was not found" }
          if (-not (Test-Path -LiteralPath $certificate -PathType Leaf)) { throw "VelocityCopy-Test.cer was not found" }
          Copy-Item -LiteralPath $bundle -Destination $payload -Force
          Copy-Item -LiteralPath $certificate -Destination $payload -Force

          foreach ($architecture in @("x64", "arm64")) {
            $sourceRoot = if ($architecture -eq "x64") { "artifacts/AppPackages" } else { "artifacts/AppPackages-ARM64" }
            $dependencies = @(
              Get-ChildItem -LiteralPath $sourceRoot -Recurse -File |
                Where-Object {
                  $_.FullName -match ("[\\/]Dependencies[\\/]" + $architecture + "[\\/]") -and
                  $_.Extension -in ".appx", ".msix"
                }
            )
            if ($dependencies.Count -eq 0) { throw "$architecture package dependencies were not found" }

            $dependencyStage = Join-Path $payload ("Dependencies\" + $architecture)
            New-Item -ItemType Directory -Force -Path $dependencyStage | Out-Null
            foreach ($dependency in $dependencies) {
              Copy-Item -LiteralPath $dependency.FullName -Destination $dependencyStage -Force
            }
          }

          Copy-Item -LiteralPath "tools/Install-VelocityCopy-Test.ps1" -Destination $payload -Force

      - name: Smoke install packaged MSIX bundle
        shell: pwsh
        timeout-minutes: 5
        run: |
          $payload = (Resolve-Path "artifacts/VelocityCopy-InstallerPayload").Path
          $script = Join-Path $payload "Install-VelocityCopy-Test.ps1"
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Staged VelocityCopy installer script was not found"
          }

          try {
            & $script

            $installed = Get-AppxPackage -Name "ReinierTutoriales.VelocityCopy" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $installed) {
              throw "VelocityCopy package is absent after smoke installation"
            }
            if ($installed.PackageFamilyName -notmatch '^ReinierTutoriales\.VelocityCopy_') {
              throw "Unexpected VelocityCopy package family: $($installed.PackageFamilyName)"
            }
            Write-Host "Smoke-installed $($installed.PackageFullName)"
          }
          finally {
            if (Test-Path -LiteralPath $script -PathType Leaf) {
              & $script -Uninstall
            }
          }

      - name: Build single-file Windows installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }

          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe was not found" }

          $payload = (Resolve-Path "artifacts/VelocityCopy-InstallerPayload").Path
          $outputDir = "artifacts/installer"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $output = Join-Path (Resolve-Path $outputDir).Path "VelocityCopy-Setup.exe"

          if (-not $env:VELOCITYCOPY_PACKAGE_VERSION) { throw "Stamped VelocityCopy package version is unavailable" }
          & $makensis "/DPAYLOAD_DIR=$payload" "/DOUTPUT_FILE=$output" "/DDISPLAY_VERSION=$env:VELOCITYCOPY_PACKAGE_VERSION" "tools/VelocityCopy-Test-Installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "VelocityCopy setup generation failed" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "VelocityCopy-Setup.exe was not produced" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VelocityCopy-Setup
          path: artifacts/installer/VelocityCopy-Setup.exe
          if-no-files-found: error
          retention-days: 14
