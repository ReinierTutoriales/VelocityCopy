name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build core
        run: cmake --build build --config Release --parallel

      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stamp test package version
        shell: pwsh
        run: |
          $manifest = "src/ui/VelocityCopy.UI/Package.appxmanifest"
          $version = "0.20.$env:GITHUB_RUN_NUMBER.0"
          $content = Get-Content -LiteralPath $manifest -Raw
          $content = [regex]::Replace(
            $content,
            '(<Identity\s+Name="ReinierTutoriales\.VelocityCopy"\s+Publisher="CN=ReinierTutoriales"\s+Version=")[^"]+(")',
            ('${1}' + $version + '${2}')
          )
          Set-Content -LiteralPath $manifest -Value $content -Encoding utf8

          $stamped = Get-Content -LiteralPath $manifest -Raw
          if ($stamped -notmatch ('Version="' + [regex]::Escape($version) + '"')) {
            throw "Failed to stamp VelocityCopy package version $version"
          }
          Write-Host "VelocityCopy test package version: $version"

      - name: Build WinUI 3 x64 Release and MSIX
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          $packageDir = Join-Path (Resolve-Path ".").Path "artifacts\AppPackages\"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          & $msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir"
          if ($LASTEXITCODE -ne 0) { throw "WinUI/MSIX build failed with exit code $LASTEXITCODE" }

      - name: Sign Windows test MSIX
        shell: pwsh
        timeout-minutes: 5
        run: |
          $packages = @(
            Get-ChildItem -Path artifacts/AppPackages -Recurse -File -Filter *.msix |
              Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" }
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one VelocityCopy MSIX package, found $($packages.Count)"
          }

          $plainPassword = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $plainPassword -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=ReinierTutoriales" `
            -KeyUsage DigitalSignature `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            ) `
            -FriendlyName "VelocityCopy CI Test Signing"

          $pfx = Join-Path $env:RUNNER_TEMP "VelocityCopy-Test.pfx"
          $cer = Join-Path (Resolve-Path ".").Path "artifacts\AppPackages\VelocityCopy-Test.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "SignTool.exe was not found" }

          foreach ($package in $packages) {
            & $signtool.FullName sign /fd SHA256 /a /f $pfx /p $plainPassword $package.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($package.FullName)" }

            $signature = Get-AuthenticodeSignature -FilePath $package.FullName
            if (-not $signature.SignerCertificate) {
              throw "No Authenticode signer certificate found for $($package.FullName)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Unexpected signer certificate for $($package.FullName)"
            }
          }

          Remove-Item -LiteralPath $pfx -Force
          Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force

      - name: Stage installer payload
        shell: pwsh
        run: |
          $payload = "artifacts/VelocityCopy-InstallerPayload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          $packageRoot = (Resolve-Path "artifacts/AppPackages").Path
          $main = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter *.msix |
            Where-Object { $_.FullName -notmatch "[\\/]Dependencies[\\/]" } |
            Select-Object -First 1
          if (-not $main) { throw "VelocityCopy MSIX package was not found" }

          Copy-Item -LiteralPath $main.FullName -Destination $payload -Force
          Copy-Item -LiteralPath (Join-Path $packageRoot "VelocityCopy-Test.cer") -Destination $payload -Force

          $x64Dependencies = Get-ChildItem -LiteralPath $packageRoot -Recurse -File |
            Where-Object {
              $_.FullName -match "[\\/]Dependencies[\\/]x64[\\/]" -and
              $_.Extension -in ".appx", ".msix"
            }
          if (-not $x64Dependencies) { throw "x64 package dependencies were not found" }

          $dependencyStage = Join-Path $payload "Dependencies\x64"
          New-Item -ItemType Directory -Force -Path $dependencyStage | Out-Null
          foreach ($dependency in $x64Dependencies) {
            Copy-Item -LiteralPath $dependency.FullName -Destination $dependencyStage -Force
          }

          Copy-Item -LiteralPath "tools/Install-VelocityCopy-Test.ps1" -Destination $payload -Force

      - name: Build single-file Windows installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }

          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe was not found" }

          $payload = (Resolve-Path "artifacts/VelocityCopy-InstallerPayload").Path
          $outputDir = "artifacts/installer"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $output = Join-Path (Resolve-Path $outputDir).Path "VelocityCopy-Setup-x64.exe"

          & $makensis "/DPAYLOAD_DIR=$payload" "/DOUTPUT_FILE=$output" "tools/VelocityCopy-Test-Installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "VelocityCopy setup generation failed" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "VelocityCopy-Setup-x64.exe was not produced" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VelocityCopy-Setup-x64
          path: artifacts/installer/VelocityCopy-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
