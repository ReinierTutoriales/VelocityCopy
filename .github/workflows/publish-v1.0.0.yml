name: Publish v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.0.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish validated v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 6894a24ac6599c8225be3ecd7c35b02d80254b60
          PACKAGE_RUN: "35807798118"
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; nothing to do."
            exit 0
          fi

          mkdir -p dist/x64 dist/arm64
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "VelocityCopy-Setup-x64-1.0.0.0" --dir dist/x64
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "VelocityCopy-Setup-arm64-1.0.0.0" --dir dist/arm64

          x64_installer="$(find dist/x64 -type f -iname '*.exe' | head -n 1)"
          arm64_installer="$(find dist/arm64 -type f -iname '*.exe' | head -n 1)"
          test -n "$x64_installer"
          test -n "$arm64_installer"

          cp "$x64_installer" "dist/VelocityCopy-Setup-x64-v1.0.0.exe"
          cp "$arm64_installer" "dist/VelocityCopy-Setup-ARM64-v1.0.0.exe"

          cat > release-notes.md <<'EOF'
          ## VelocityCopy 1.0.0

          First stable Windows 11 release of VelocityCopy.

          ### Highlights
          - Compact WinUI 3 copy/move surface with integrated progress and expandable queue.
          - Explorer integration with direct shell-driven transfers.
          - Multi-window transfer routing for same-destination and same-device scenarios.
          - Pause, resume, skip, stop and cancel controls.
          - Native conflict, routing and recovery decisions.
          - Shutdown recovery and queue persistence.
          - Self-contained classic installers for x64 and ARM64 Windows 11.

          ### Install
          Download the installer that matches your PC:
          - **x64:** `VelocityCopy-Setup-x64-v1.0.0.exe`
          - **ARM64:** `VelocityCopy-Setup-ARM64-v1.0.0.exe`

          This release was produced from validated commit `6894a24ac6599c8225be3ecd7c35b02d80254b60` after Windows CI and Windows Package completed successfully.
          EOF

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "VelocityCopy v1.0.0" \
            --notes-file release-notes.md \
            "dist/VelocityCopy-Setup-x64-v1.0.0.exe#VelocityCopy x64 installer" \
            "dist/VelocityCopy-Setup-ARM64-v1.0.0.exe#VelocityCopy ARM64 installer"
