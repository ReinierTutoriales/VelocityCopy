name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            test: true
          - arch: arm64
            cmake_arch: ARM64
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ${{ matrix.arch }} Release
        run: cmake -S . -B build/${{ matrix.cmake_arch }} -A ${{ matrix.cmake_arch }}

      - name: Build core
        run: cmake --build build/${{ matrix.cmake_arch }} --config Release --parallel

      - name: Test core
        if: ${{ matrix.test }}
        timeout-minutes: 10
        run: ctest --test-dir build/x64 -C Release --output-on-failure --timeout 120

  asan:
    runs-on: windows-latest
    env:
      ASAN_OPTIONS: abort_on_error=0:halt_on_error=0:detect_leaks=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 RelWithDebInfo ASan
        run: cmake -S . -B build/asan -A x64 -DVELOCITYCOPY_ENABLE_ASAN=ON

      - name: Build ASan core
        run: cmake --build build/asan --config RelWithDebInfo --parallel

      - name: Expose MSVC ASan runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "Visual Studio was not found for ASan runtime" }
          $dll = Get-ChildItem $vs -Recurse -File -Filter clang_rt.asan_dynamic-x86_64.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $dll) { throw "MSVC ASan runtime DLL was not found" }
          $dir = $dll.Directory.FullName
          $dir | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Get-ChildItem build/asan/RelWithDebInfo -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $dll.FullName -Destination $_.Directory.FullName -Force
          }
          Write-Host "ASan runtime: $($dll.FullName)"

      - name: Test ASan core
        timeout-minutes: 10
        run: ctest --test-dir build/asan -C RelWithDebInfo -R architecture --output-on-failure --timeout 60
