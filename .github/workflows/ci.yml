name: Windows CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build/x64 -A x64

      - name: Build core
        run: cmake --build build/x64 --config Release --parallel

      - name: Test core
        timeout-minutes: 10
        run: ctest --test-dir build/x64 -C Release --output-on-failure --timeout 120

  core-asan:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 ASan
        run: cmake -S . -B build/asan -A x64 -DVELOCITYCOPY_ENABLE_ASAN=ON

      - name: Build Core and tests with ASan
        timeout-minutes: 15
        run: cmake --build build/asan --config RelWithDebInfo --parallel

      - name: Prepare MSVC ASan runtime
        shell: pwsh
        run: |
          $roots = @(
            "${env:ProgramFiles}\Microsoft Visual Studio",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
          ) | Where-Object { Test-Path -LiteralPath $_ }

          $runtime = $null
          foreach ($root in $roots) {
            $runtime = Get-ChildItem -LiteralPath $root -Recurse -File -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($runtime) { break }
          }

          if (-not $runtime) {
            throw "MSVC x64 AddressSanitizer runtime clang_rt.asan_dynamic-x86_64.dll was not found on the runner"
          }

          Write-Host "Using ASan runtime: $($runtime.FullName)"
          $runtimeDir = $runtime.Directory.FullName
          $runtimeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test Core with ASan
        timeout-minutes: 10
        shell: pwsh
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0"
        run: |
          where.exe clang_rt.asan_dynamic-x86_64.dll
          ctest --test-dir build/asan -C RelWithDebInfo -V --output-on-failure --timeout 120
