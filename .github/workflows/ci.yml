name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diff-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: pwsh
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD

  core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            test: true
          - arch: arm64
            cmake_arch: ARM64
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure ${{ matrix.arch }} Release
        run: cmake -S . -B build/${{ matrix.cmake_arch }} -A ${{ matrix.cmake_arch }}

      - name: Build core
        run: cmake --build build/${{ matrix.cmake_arch }} --config Release --parallel

      - name: Test core
        if: ${{ matrix.test }}
        timeout-minutes: 10
        run: ctest --test-dir build/x64 -C Release --output-on-failure --timeout 120

  asan:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure x64 RelWithDebInfo ASan
        run: cmake -S . -B build/asan -A x64 -DVELOCITYCOPY_ENABLE_ASAN=ON

      - name: Build ASan core
        run: cmake --build build/asan --config RelWithDebInfo --parallel


  ui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build UI
        run: msbuild src/ui/VelocityCopy.UI/VelocityCopy.UI.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64

      - name: Smoke launch built x64 output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/ui/VelocityCopy.UI -Recurse -File -Filter VelocityCopy.WinUI.exe | Select-Object -First 1
          if (-not $exe) { throw "Built x64 executable was not found" }
          $env:VELOCITYCOPY_DIAGNOSTIC_LOG = Join-Path $env:RUNNER_TEMP "velocitycopy-unhandled.log"
          Remove-Item $env:VELOCITYCOPY_DIAGNOSTIC_LOG -ErrorAction SilentlyContinue
          $app = Start-Process $exe.FullName -WorkingDirectory $exe.Directory.FullName -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) {
            if (Test-Path $env:VELOCITYCOPY_DIAGNOSTIC_LOG) { Write-Host "VelocityCopy diagnostic log:"; Get-Content $env:VELOCITYCOPY_DIAGNOSTIC_LOG }
            $exitCode = $app.ExitCode
            $hexCode = ('0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$exitCode), 0)))
            throw "Built VelocityCopy output exits during CI launch smoke: $exitCode ($hexCode)"
          }
          Stop-Process -Id $app.Id -Force

      - name: Upload launch diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VelocityCopy-launch-diagnostic-ci-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/velocitycopy-unhandled.log
          if-no-files-found: warn
          retention-days: 7
