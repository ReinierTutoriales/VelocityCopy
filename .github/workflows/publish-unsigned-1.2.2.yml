name: Publish unsigned VelocityCopy 1.2.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-unsigned-1.2.2.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-unsigned-velocitycopy-1.2.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the approved build and publish its exact installers
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, zipfile

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          repo = os.environ["GH_REPO"]
          sha = "8774ebdd3da32aa611bb4c7cab84cd56b8719565"
          version = "1.2.2.0"

          runs = api(f"repos/{repo}/actions/workflows/package.yml/runs?head_sha={sha}&event=push&status=success&per_page=10")["workflow_runs"]
          runs = [r for r in runs if r["head_sha"] == sha and r["conclusion"] == "success" and r["head_branch"] == "main"]
          assert runs, "No successful Windows Package run on main for the release commit"
          run_id = runs[0]["id"]
          existing = subprocess.run(["gh", "api", f"repos/{repo}/git/ref/tags/v1.2.2"], capture_output=True)
          assert existing.returncode != 0, "Tag v1.2.2 already exists"

          artifacts = api(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
          output = pathlib.Path("release-assets")
          output.mkdir()
          files, hashes = [], []
          for arch, filename in (("x64", "VelocityCopy-Setup-x64.exe"), ("arm64", "VelocityCopy-Setup-ARM64.exe")):
              name = f"VelocityCopy-Setup-{arch}-{version}"
              matches = [a for a in artifacts if a["name"] == name]
              assert len(matches) == 1 and not matches[0]["expired"], f"Missing artifact {name}"
              archive = output / f"{name}.zip"
              with archive.open("wb") as stream:
                  subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{matches[0]['id']}/zip"], stdout=stream, check=True)
              with zipfile.ZipFile(archive) as z:
                  entries = [i for i in z.infolist() if not i.is_dir()]
                  assert len(entries) == 1 and pathlib.PurePosixPath(entries[0].filename).name == filename, "Unexpected artifact contents"
                  binary = z.read(entries[0])
              assert binary[:2] == b"MZ", "Invalid Windows installer"
              destination = output / filename.replace(".exe", "-v1.2.2.exe")
              destination.write_bytes(binary)
              files.append(str(destination))
              hashes.append(f"{hashlib.sha256(binary).hexdigest()}  {destination.name}")
          checksum = output / "SHA256SUMS.txt"
          checksum.write_text("\n".join(hashes) + "\n")
          files.append(str(checksum))

          notes = output / "release-notes.md"
          notes.write_text(f"""VelocityCopy 1.2.2

          Compact Windows 11 redesign.

          - Skip button between Pause and Cancel; the Options menu keeps Stop, Save/Load queue, About and Hide to tray.
          - Details show two sections (Queue and Information) with a compact speed graph; the expanded window is 640 instead of 880 pixels wide.
          - Translucent Windows 11 acrylic background, like the system menus.
          - Smaller queue commands: fine chevrons and a trash icon ("Remove from queue", files are not deleted).
          - Restoring one copy from the taskbar brings back every other minimized copy that is still running.

          Full list: CHANGELOG.md.

          Downloads:
          - x64 installer for Intel/AMD Windows 11 PCs.
          - ARM64 installer for Windows on ARM PCs.

          These installers are published without an Authenticode digital signature, as explicitly authorized by the repository owner. Windows may display an unknown-publisher or SmartScreen prompt. Verify downloads against SHA256SUMS.txt.

          Source: {sha} (v1.2.2).
          Windows Package passed on this exact commit (run {run_id}); assets are that run's artifacts, not rebuilt or modified.
          ARM64 was cross-built and its PE architecture validated; a physical ARM64 install/launch/shell-integration check is not recorded by this automated publication.
          """)
          subprocess.run(["gh", "release", "create", "v1.2.2", *files, "--target", sha, "--title", "VelocityCopy v1.2.2", "--notes-file", str(notes), "--latest"], check=True)
          release = api(f"repos/{repo}/releases/tags/v1.2.2")
          names = {a["name"] for a in release["assets"]}
          assert all(pathlib.Path(f).name in names for f in files), "Release asset verification failed"
          tag = api(f"repos/{repo}/git/ref/tags/v1.2.2")
          assert tag["object"]["sha"] == sha, "Release tag points at the wrong commit"
          print(release["html_url"])
