name: Cleanup stale branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/installed-app-launch"
            "fix/windows-taskbar-dialog-integration-7f"
            "cleanup/repo-branches"
            "temp/branch-cleanup-runner"
            "cleanup/repo-branches2"
            "cleanup/repo-branches3"
            "cleanup/repo-branches4"
            "cleanup/repo-branches5"
          )
          for branch in "${branches[@]}"; do
            encoded_ref="heads/${branch}"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/$encoded_ref" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$encoded_ref"
              echo "Deleted $branch"
            else
              echo "Already absent: $branch"
            fi
          done
