name: Attribution guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject foreign authorship and AI trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -eu
          owner='ReinierTutoriales <86568548+ReinierTutoriales@users.noreply.github.com>'
          # Commits GitHub itself creates for web/API merges and edits made by the owner.
          github_web='GitHub <noreply@github.com>'

          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi

          failed=0
          for sha in $(git rev-list "$range"); do
            author=$(git show -s --format='%an <%ae>' "$sha")
            committer=$(git show -s --format='%cn <%ce>' "$sha")
            if [ "$author" != "$owner" ]; then
              echo "::error::$sha author is '$author'"
              failed=1
            fi
            if [ "$committer" != "$owner" ] && [ "$committer" != "$github_web" ]; then
              echo "::error::$sha committer is '$committer'"
              failed=1
            fi
            if git show -s --format='%B' "$sha" | grep -qiE '^(co-authored-by|claude-session):|🤖|generated (with|by) \[?(claude|codex|gemini|copilot|chatgpt|cursor)'; then
              echo "::error::$sha message carries a co-author or tool attribution trailer"
              failed=1
            fi
          done
          exit "$failed"
